<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Interactive JavaScript To-Do List application">

    <title>To-Do List | Ritik Kumar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <header class="app-header">
            <p class="eyebrow">JavaScript Project</p>
            <h1>My To-Do List</h1>
            <p>
                Add, complete and delete tasks. Your tasks are saved
                automatically in your browser.
            </p>
        </header>


        <section class="todo-card" aria-labelledby="todo-title">

            <h2 id="todo-title">Tasks</h2>

            <form id="todo-form">

                <label for="todo-input">
                    Add a new task
                </label>

                <div class="input-group">

                    <input
                        id="todo-input"
                        name="task"
                        type="text"
                        placeholder="Enter a task..."
                        autocomplete="off"
                        required>

                    <button type="submit">
                        Add Task
                    </button>

                </div>

            </form>


            <div class="todo-toolbar">

                <p id="task-count" aria-live="polite">
                    0 tasks
                </p>

                <button
                    id="clear-completed"
                    type="button">
                    Clear completed
                </button>

            </div>


            <ul
                id="todo-list"
                class="todo-list"
                aria-label="To-do tasks">
            </ul>


            <p
                id="empty-message"
                class="empty-message">
                No tasks yet. Add your first task!
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
